name: Report issue
description: Create a report to help us fix issues with the engine
body:
- type: markdown
  attributes:
    value: |
      > [!IMPORTANT]
      > Please do not open bug reports regarding the engine's choice of moves, such as the engine failing to find a particular "best" move. If you have any questions or wish to discuss engine analysis, please use our community channels, such as Discord.

- type: textarea
  attributes:
    label: Describe the issue
    description: A clear and concise description of what you're experiencing.
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected behavior
    description: A clear and concise description of what you expected to happen.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to reproduce
    description: |
      Steps to reproduce the behavior.
      You can also use this section to paste the command line output.
    placeholder: |
      ```
      position startpos moves g2g4 e7e5 f2f3
      go mate 1
      info string Available Processors: 0-31
      info string Threads: 1
      info string NNUE evaluation using nn-71d6d32cb962.nnue (106MiB, (83248, 1024, 31, 32, 1))
      info string Network replica 0: Shared memory.
      info depth 1 seldepth 2 multipv 1 score mate 1 time 1 nodes 30 nps 30000 tbhits 0 hashfull 0 pv d8h4
      bestmove d8h4 ponder (none)
      ```
  validations:
    required: true

- type: textarea
  attributes:
    label: Anything else?
    description: |
      Anything that will give us more context about the issue you are encountering.
      You can also use this section to propose ideas on how to solve the issue. 
  validations:
    required: false

- type: dropdown
  attributes:
    label: Operating system
    options:
      - All
      - Windows
      - Linux
      - macOS
      - Android
      - Other or N/A
  validations:
    required: true

- type: input
  attributes:
    label: DON version
    description: |
      This can be found by running the engine.
      You can also use the commit ID.
    placeholder: DON 1.0 / de27517
  validations:
    required: true
