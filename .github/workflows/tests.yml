name: Tests

on:
  workflow_call:

jobs:
  TestTargets:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      COMPCXX: ${{ matrix.config.compiler }}
      COMP: ${{ matrix.config.comp }}
      CXXFLAGS: "-Werror"
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android NDK ARMv8
            os: ubuntu-22.04
            compiler: aarch64-linux-android29-clang++
            comp: ndk
            run_armv8_tests: true
            shell: bash
          - name: Android NDK ARMv7
            os: ubuntu-22.04
            compiler: armv7a-linux-androideabi29-clang++
            comp: ndk
            run_armv7_tests: true
            shell: bash
          - name: Ubuntu 22.04 GCC x86
            os: ubuntu-22.04
            compiler: g++
            comp: gcc
            run_32bit_tests: true
            run_64bit_tests: true
            shell: bash
          - name: Ubuntu 22.04 Clang x86
            os: ubuntu-22.04
            compiler: clang++
            comp: clang
            run_32bit_tests: true
            run_64bit_tests: true
            shell: bash
          - name: Ubuntu 22.04 GCC LoongArch64
            os: ubuntu-22.04
            compiler: g++
            comp: gcc
            run_loongarch64_tests: true
            base_image: "loongarch64/alpine:3.21"
            platform: linux/loong64
            shell: bash
          - name: Ubuntu 22.04 GCC PPC64LE
            os: ubuntu-22.04
            compiler: g++
            comp: gcc
            run_ppc64_tests: true
            base_image: "ppc64le/alpine:latest"
            platform: linux/ppc64le
            shell: bash
          - name: Ubuntu 22.04 GCC RISC-V64
            os: ubuntu-22.04
            compiler: g++
            comp: gcc
            run_riscv64_tests: true
            base_image: "riscv64/alpine:edge"
            platform: linux/riscv64
            shell: bash
          - name: Windows 2022 MinGW-w64 GCC x86-64
            os: windows-2022
            compiler: g++
            comp: mingw
            run_64bit_tests: true
            msys_sys: mingw64
            msys_env: x86_64-gcc
            shell: msys2 {0}
          - name: Windows 2022 MinGW-w64 Clang x86-64
            os: windows-2022
            compiler: clang++
            comp: clang
            run_64bit_tests: true
            msys_sys: clang64
            msys_env: clang-x86_64-clang
            shell: msys2 {0}
          - name: Windows 2022 MinGW-w64 GCC x86-32
            os: windows-2022
            compiler: g++
            comp: mingw
            run_32bit_tests: true
            msys_sys: mingw32
            msys_env: i686-gcc
            shell: msys2 {0}
          - name: Windows 11 ARM64 MinGW-w64 Clang
            os: windows-11-arm
            compiler: clang++
            comp: clang
            run_armv8_tests: true
            msys_sys: clangarm64
            msys_env: clang-aarch64-clang
            shell: msys2 {0}
          - name: macOS 15 Intel GCC 11
            os: macos-15-intel
            compiler: g++-11
            comp: gcc
            run_64bit_tests: true
            shell: bash
          - name: macOS 15 Intel Apple Clang
            os: macos-15-intel
            compiler: clang++
            comp: clang
            run_64bit_tests: true
            shell: bash
          - name: macOS 15 Apple Silicon Clang
            os: macos-15
            compiler: clang++
            comp: clang
            run_arm64_tests: true
            shell: bash
    defaults:
      run:
        working-directory: src
        shell: ${{ matrix.config.shell }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download required linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install expect valgrind g++-multilib qemu-user-static

      - name: Install NDK
        if: runner.os == 'Linux'
        run: |
          if [ $COMP == ndk ]; then
            NDKV="27.2.12479018"
            ANDROID_ROOT=/usr/local/lib/android
            ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
            SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
            echo "y" | $SDKMANAGER "ndk;$NDKV"
            ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
            ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
            echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> "$GITHUB_ENV"
          fi

      - name: Set up QEMU
        if: matrix.config.base_image
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        if: matrix.config.base_image
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker container
        if: matrix.config.base_image
        run: |
          docker buildx build --platform ${{ matrix.config.platform }} --load -t don_builder - << EOF
          FROM ${{ matrix.config.base_image }}
          WORKDIR /app
          RUN apk update && apk add make g++
          CMD ["sh", "src/script.sh"]
          EOF

      - name: Download required macOS packages
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Install GCC 11 on macOS
        if: runner.os == 'macOS' && matrix.config.comp == 'gcc'
        run: |
          brew install gcc@11 || true
          g++-11 --version

      - name: Setup msys and install required packages
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: ${{ matrix.config.msys_sys }}
          install: mingw-w64-${{ matrix.config.msys_env }} make git expect

      - name: Download the used network from the fishtest framework
        run: make net

      - name: Extract the bench number from the commit history
        run: |
          benchref=""
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s "$hash" |
              tac |
              grep -m 1 -o -x '[[:space:]]*[Bb]ench[ :]\{1,\}[1-9][0-9]\{5,7\}[[:space:]]*' |
              sed 's/[^0-9]//g') || true

            if [ -n "$benchref" ]; then
              break
            fi
          done

          if [ -n "$benchref" ]; then
            echo "benchref=$benchref" >> "$GITHUB_ENV"
            echo "From commit: $hash"
            echo "Reference bench: $benchref"
          else
            echo "No bench found"
          fi

      - name: Check compiler version
        run: |
          if [ -z "${{ matrix.config.base_image }}" ]; then
            if [ "$COMP" = "ndk" ]; then
              export PATH="${{ env.ANDROID_NDK_BIN }}:$PATH"
            fi
            "$COMPCXX" -v
          else
            echo "\"$COMPCXX\" -v" > script.sh
            docker run --rm --platform "${{ matrix.config.platform }}" -v "${{ github.workspace }}:/app" don_builder
          fi

      - name: Check Make help
        run: make help

      - name: Check Git version
        run: git --version

      # x86-64 tests

      - name: Build and test x86-64 BMI2 Debug
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-bmi2 optimize=no debug=yes ENV_CXXFLAGS="-Werror -D_GLIBCXX_DEBUG" build
          ../tests/signature.sh $benchref

      - name: Build and test x86-64 BMI2
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-bmi2 build
          ../tests/signature.sh $benchref

      - name: Build and test x86-64 AVX2
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-avx2 build
          ../tests/signature.sh $benchref

      - name: Build and test x86-64 SSE4.1 with POPCNT
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-sse41-popcnt build
          ../tests/signature.sh $benchref

      - name: Build and test x86-64 Modern (deprecated)
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-modern build
          ../tests/signature.sh $benchref

      - name: Build and test x86-64 SSE4.1
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-sse41 build
          ../tests/signature.sh $benchref

      - name: Build and test x86-64 SSSE3 with POPCNT
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-ssse3-popcnt build
          ../tests/signature.sh $benchref

      - name: Build and test x86-64 SSSE3
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-ssse3 build
          ../tests/signature.sh $benchref

      - name: Build and test x86-64
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64 build
          ../tests/signature.sh $benchref

      - name: Build and test General 64-bit
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=general-64 build
          ../tests/signature.sh $benchref

      # x86-32 tests

      - name: Build and test x86-32 SSE4.1 with POPCNT Debug
        if: matrix.config.run_32bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-32-sse41-popcnt optimize=no debug=yes ENV_CXXFLAGS="-Werror -D_GLIBCXX_DEBUG" build
          ../tests/signature.sh $benchref

      - name: Build and test x86-32 SSE4.1 with POPCNT
        if: matrix.config.run_32bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-32-sse41-popcnt build
          ../tests/signature.sh $benchref

      - name: Build and test x86-32 SSE4.1
        if: matrix.config.run_32bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-32-sse41 build
          ../tests/signature.sh $benchref

      - name: Build and test x86-32 SSSE3
        if: matrix.config.run_32bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-32-ssse3 build
          ../tests/signature.sh $benchref

      - name: Build and test x86-32 SSE2
        if: matrix.config.run_32bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-32-sse2 build
          ../tests/signature.sh $benchref

      - name: Build and test x86-32
        if: matrix.config.run_32bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-32 build
          ../tests/signature.sh $benchref

      - name: Build and test General 32-bit
        if: matrix.config.run_32bit_tests
        run: |
          make clean
          make -j4 ARCH=general-32 build
          ../tests/signature.sh $benchref

      # loongarch64 tests

      - name: Build and test LoongArch64 LASX
        if: matrix.config.run_loongarch64_tests
        run: |
          echo "cd src && export LDFLAGS='-static' && make clean && make -j4 ARCH=loongarch64-lasx build" > script.sh
          docker run --rm --platform ${{ matrix.config.platform }} -v ${{ github.workspace }}:/app don_builder
          ../tests/signature.sh $benchref

      - name: Build and test LoongArch64 LSX
        if: matrix.config.run_loongarch64_tests
        run: |
          echo "cd src && export LDFLAGS='-static' && make clean && make -j4 ARCH=loongarch64-lsx build" > script.sh
          docker run --rm --platform ${{ matrix.config.platform }} -v ${{ github.workspace }}:/app don_builder
          ../tests/signature.sh $benchref

      - name: Build and test LoongArch64
        if: matrix.config.run_loongarch64_tests
        run: |
          echo "cd src && export LDFLAGS='-static' && make clean && make -j4 ARCH=loongarch64 build" > script.sh
          docker run --rm --platform ${{ matrix.config.platform }} -v ${{ github.workspace }}:/app don_builder
          ../tests/signature.sh $benchref

      # ppc64 tests

      - name: Build and test PPC64 VSX
        if: matrix.config.run_ppc64_tests
        run: |
          echo "cd src && export LDFLAGS='-static' && make clean && make -j4 ARCH=ppc-64-vsx build" > script.sh
          docker run --rm --platform ${{ matrix.config.platform }} -v ${{ github.workspace }}:/app don_builder
          ../tests/signature.sh $benchref

      - name: Build and test PPC64 AltiVec
        if: matrix.config.run_ppc64_tests
        run: |
          echo "cd src && export LDFLAGS='-static' && make clean && make -j4 ARCH=ppc-64-altivec build" > script.sh
          docker run --rm --platform ${{ matrix.config.platform }} -v ${{ github.workspace }}:/app don_builder
          ../tests/signature.sh $benchref

      - name: Build and test PPC64
        if: matrix.config.run_ppc64_tests
        run: |
          echo "cd src && export LDFLAGS='-static' && make clean && make -j4 ARCH=ppc-64 build" > script.sh
          docker run --rm --platform ${{ matrix.config.platform }} -v ${{ github.workspace }}:/app don_builder
          ../tests/signature.sh $benchref

      # riscv64 tests

      # - name: Build and test RISC-V64 RVA23
      #   if: matrix.config.run_riscv64_tests
      #   run: |
      #     echo "cd src && export LDFLAGS='-static' && make clean && make -j4 ARCH=riscv64-rva23 build" >> script.sh
      #     echo "./DON bench" >> script.sh
      #     docker run --rm --platform ${{ matrix.config.platform }} -v ${{ github.workspace }}:/app don_builder
      #     ../tests/signature.sh $benchref

      - name: Build and test RISC-V64
        if: matrix.config.run_riscv64_tests
        run: |
          echo "cd src && export LDFLAGS='-static' && make clean && make -j4 ARCH=riscv64 build" > script.sh
          docker run --rm --platform ${{ matrix.config.platform }} -v ${{ github.workspace }}:/app don_builder
          ../tests/signature.sh $benchref

      # armv8 tests

      - name: Build and test ARMv8 NEON DOTPROD
        if: matrix.config.run_armv8_tests
        run: |
          if [ "$COMP" = "ndk" ]; then
            export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
            export LDFLAGS="-static -Wno-unused-command-line-argument"
          fi
          make clean
          make -j4 ARCH=armv8-dotprod build
          ../tests/signature.sh $benchref

      - name: Build and test ARMv8 NEON
        if: matrix.config.run_armv8_tests
        run: |
          if [ "$COMP" = "ndk" ]; then
            export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
            export LDFLAGS="-static -Wno-unused-command-line-argument"
          fi
          make clean
          make -j4 ARCH=armv8 build
          ../tests/signature.sh $benchref

      # armv7 tests

      - name: Build and test ARMv7 NEON
        if: matrix.config.run_armv7_tests
        run: |
          export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
          export LDFLAGS="-static -Wno-unused-command-line-argument"
          make clean
          make -j4 ARCH=armv7-neon build
          ../tests/signature.sh $benchref

      - name: Build and test ARMv7
        if: matrix.config.run_armv7_tests
        run: |
          export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
          export LDFLAGS="-static -Wno-unused-command-line-argument"
          make clean
          make -j4 ARCH=armv7 build
          ../tests/signature.sh $benchref

      # Apple Silicon tests
      - name: Build and test Apple Silicon
        if: matrix.config.run_arm64_tests
        run: |
          make clean
          make -j4 ARCH=apple-silicon build
          ../tests/signature.sh $benchref

      - name: Build and test Apple Silicon with system g++ (macOS g++ == clang++)
        if: matrix.config.run_arm64_tests
        run: |
          make clean
          env -u COMPCXX make -j4 ARCH=apple-silicon COMP=gcc build
          ../tests/signature.sh $benchref

      # Other tests

      - name: Verify perft and search reproducibility
        if: matrix.config.run_64bit_tests
        run: |
          make clean
          make -j4 ARCH=x86-64-avx2 build
          ../tests/perft.sh
          ../tests/reprosearch.sh
