name: DON

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

# concurrency:
#   group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
#   cancel-in-progress: true

jobs:
  Prerelease:
    name: Prerelease
    if: github.repository == 'ehsanrashid/DON' && (github.ref == 'refs/heads/main' || (startsWith(github.ref_name, 'DON_') && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    needs: [Matrix, BuildAndroid, BuildUniversal]
    permissions:
      contents: write # For deleting/creating a prerelease
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # Returns 'null' if no pre-release exists
      - name: Get Latest Pre-release Tag
        id: get-prerelease-tag
        run: |
          # Install required packages
          sudo apt-get update
          sudo apt-get install -y curl jq

          RELEASES=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases")
          PRERELEASE_TAG=$(jq -r 'map(select(.prerelease)) | first | .tag_name' <<< "$RELEASES")

          echo "PRERELEASE_TAG=$PRERELEASE_TAG" >> "$GITHUB_OUTPUT"

      # Delete previous pre-release and tag
      - run: gh release delete ${{ steps.get-prerelease-tag.outputs.PRERELEASE_TAG }} --cleanup-tag
        if: steps.get-prerelease-tag.outputs.PRERELEASE_TAG != 'null'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Make sure that an old CI run on main doesn't recreate a prerelease
      - name: Check Pullable Commits
        id: check-commits
        run: |
          git fetch origin main
          CHANGES=$(git rev-list HEAD..origin/main --count)
          echo "CHANGES=$CHANGES" >> "$GITHUB_ENV"

      - name: Get last commit SHA
        id: last-commit
        run: echo "COMMIT_SHA=$(git rev-parse HEAD | cut -c 1-8)" >> "$GITHUB_ENV"

      - name: Get commit date
        id: commit-date
        run: echo "COMMIT_DATE=$(git show -s --date=format:'%Y%m%d' --format=%cd HEAD)" >> "$GITHUB_ENV"

      - name: Official Release?
        id: official-release
        # Check for "Official release version of DON" in the commit message
        run: |
          if git log -1 --format=%B | grep -q "Official release version of DON"; then
            echo "OFFICIAL_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "OFFICIAL_RELEASE=false" >> "$GITHUB_ENV"
          fi

      # Get recent commits for release body
      - name: Get commits in this push
        id: recent-commits
        run: |
          COMMITS=$(git log \
            --format="- [\`%h\`](https://github.com/${{ github.repository }}/commit/%H) *%s*" \
            ${{ github.event.before }}..HEAD)

          echo "COMMITS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Create a new pre-release; upload_binary.yml will upload the binaries to it
      - name: Create Prerelease
        if: github.ref_name == 'main' && env.CHANGES == '0' && env.OFFICIAL_RELEASE == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: DON dev-${{ env.COMMIT_DATE }}-${{ env.COMMIT_SHA }}
          tag_name: DON-dev-${{ env.COMMIT_DATE }}-${{ env.COMMIT_SHA }}
          prerelease: true
          body: |
            Precompiled binaries of the latest DON development version, built automatically on every commit.

            > [!NOTE]
            > For stable, thoroughly tested builds use the [official releases](https://github.com/ehsanrashid/DON/releases).
            > Pre-releases may contain bugs.

            *Some platforms ship a **universal binary** that automatically selects the best
            instruction set for your CPU - no manual selection needed.*

            ---

            ## Commits

            ${{ steps.recent-commits.outputs.COMMITS }}

            [View all commits →](https://github.com/${{ github.repository }}/commits/main)

  Matrix:
    name: Prepare Matrices
    runs-on: ubuntu-latest
    outputs:
      android_matrix: ${{ steps.set-android-matrix.outputs.ANDROID_MATRIX }}
      universal_matrix: ${{ steps.set-universal-matrix.outputs.UNIVERSAL_MATRIX }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: set-android-matrix
        run: |
          ANDROID_MATRIX=$(jq -c '.' .github/ci/android_matrix.json)
          echo "ANDROID_MATRIX=$ANDROID_MATRIX" >> "$GITHUB_OUTPUT"
      - id: set-universal-matrix
        run: |
          UNIVERSAL_MATRIX=$(jq -c '.' .github/ci/universal_matrix.json)
          echo "UNIVERSAL_MATRIX=$UNIVERSAL_MATRIX" >> "$GITHUB_OUTPUT"
  # Testing Jobs
  IWYU:
    name: IWYU
    uses: ./.github/workflows/iwyu.yml
  Sanitizers:
    name: Sanitizers
    if: ${{ always() }}
    uses: ./.github/workflows/sanitizers.yml
  Tests:
    name: Tests
    if: ${{ always() }}
    uses: ./.github/workflows/tests.yml
  Matetrack:
    name: Matetrack
    if: ${{ always() }}
    uses: ./.github/workflows/matetrack.yml
  Games:
    name: Games
    if: ${{ always() }}
    uses: ./.github/workflows/games.yml
  CheckCompilers:
    name: Check Compilers
    if: ${{ always() }}
    uses: ./.github/workflows/check_compilers.yml
  # BuildMSVC:
  #   name: Build MSVC
  #   if: ${{ always() }}
  #   uses: ./.github/workflows/build_msvc.yml
  # BuildWASM:
  #   name: Build WASM
  #   if: ${{ always() }}
  #   uses: ./.github/workflows/build_wasm.yml
  # Release Jobs
  BuildAndroid:
    name: Build Android
    needs: [Matrix, Sanitizers, Tests, Matetrack, Games, CheckCompilers]
    uses: ./.github/workflows/build_android.yml
    with:
      matrix: ${{ needs.Matrix.outputs.android_matrix }}
  BuildUniversal:
    name: Build Universal
    needs: [Matrix, Sanitizers, Tests, Matetrack, Games, CheckCompilers]
    uses: ./.github/workflows/build_universal.yml
  UploadAndroid:
    if: github.repository == 'ehsanrashid/DON'
    name: Upload Android
    needs: [Prerelease, Matrix]
    uses: ./.github/workflows/upload_binary.yml
    with:
      matrix: ${{ needs.Matrix.outputs.android_matrix }}
    permissions:
      contents: write # For deleting/creating a (pre)release
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
  UploadUniversal:
    if: github.repository == 'ehsanrashid/DON'
    name: Upload Universal
    needs: [Prerelease, Matrix]
    uses: ./.github/workflows/upload_binary.yml
    with:
      matrix: ${{ needs.Matrix.outputs.universal_matrix }}
    permissions:
      contents: write # For deleting/creating a (pre)release
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
