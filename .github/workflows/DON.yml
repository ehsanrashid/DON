name: DON

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Prerelease:
    if: github.repository == 'ehsanrashid/DON' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    needs: [Matrix, BuildUniversal, BuildAndroid]
    outputs:
      release_tag: ${{ steps.prerelease-metadata.outputs.release_tag }}
    permissions:
      contents: write # For managing the dev prerelease
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # Make sure that an old CI run on main doesn't recreate a prerelease
      - name: Get Pullable Commit Count
        id: commit-count
        run: |
          git fetch
          echo "COMMITS_AHEAD=$(git rev-list HEAD..origin/main --count)" >> "$GITHUB_OUTPUT"

      - name: Official Release?
        id: official-release
        # Check for "Official release version of DON" in the commit message
        run: |
          if git log -1 --format=%B | grep -q "Official release version of DON"; then
            echo "OFFICIAL_RELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "OFFICIAL_RELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute prerelease metadata
        id: prerelease-metadata
        env:
          COMMITS_AHEAD: ${{ steps.commit-count.outputs.COMMITS_AHEAD }}
          OFFICIAL_RELEASE: ${{ steps.official-release.outputs.OFFICIAL_RELEASE }}
        run: |
          COMMIT_DATE=$(git show -s --date=format:'%Y%m%d' --format=%cd HEAD)
          COMMIT_SHA=$(git rev-parse HEAD | cut -c 1-8)

          if [[ "${{ github.ref_name }}" == 'main' && "$COMMITS_AHEAD" == '0' && "$OFFICIAL_RELEASE" == 'false' ]]; then
            echo "release_name=DON dev-$COMMIT_DATE-$COMMIT_SHA" >> "$GITHUB_OUTPUT"
            echo "release_tag=DON-dev-$COMMIT_DATE-$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "release_name=" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
          fi

      # Get recent commits for release body
      - name: Get commits in this push
        id: recent-commits
        run: |
          if [[ "${{ github.ref_type }}" == 'tag' ]]; then
            COMMITS=$(git log \
              --format="- [\`%h\`](https://github.com/${{ github.repository }}/commit/%H) *%s*" \
              HEAD~1..HEAD)
          else
            COMMITS=$(git log \
              --format="- [\`%h\`](https://github.com/${{ github.repository }}/commit/%H) *%s*" \
              ${{ github.event.before }}..HEAD)
          fi

          echo "COMMITS<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Get Latest Prerelease Tag
        id: latest-prerelease
        if: steps.prerelease-metadata.outputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_RELEASE_TAG=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 100 --json tagName,isPrerelease | jq -r 'map(select(.isPrerelease)) | first | .tagName // "null"')
          echo "LATEST_RELEASE_TAG=$LATEST_RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Delete Previous Prerelease
        if: steps.prerelease-metadata.outputs.release_tag != '' && steps.latest-prerelease.outputs.LATEST_RELEASE_TAG != 'null'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.latest-prerelease.outputs.LATEST_RELEASE_TAG }}" --repo "${{ github.repository }}" --cleanup-tag

      - name: Create Draft Prerelease
        if: steps.prerelease-metadata.outputs.release_tag != ''
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          name: ${{ steps.prerelease-metadata.outputs.release_name }}
          tag_name: ${{ steps.prerelease-metadata.outputs.release_tag }}
          draft: true
          prerelease: true
          body: |
            Precompiled binaries of the latest DON development version, built automatically on every commit.

            > [!NOTE]
            > For stable, thoroughly tested builds use the [official releases](https://github.com/ehsanrashid/DON/releases).
            > Pre-releases may contain bugs.

            *Some platforms ship universal binary that automatically selects the best instruction set for your CPU.
             No manual selection is required.*

            ---

            ## Commits

            ${{ steps.recent-commits.outputs.COMMITS }}

            [View all commits →](https://github.com/${{ github.repository }}/commits/main)

  Matrix:
    name: Prepare Matrices
    runs-on: ubuntu-slim
    outputs:
      universal_matrix: ${{ steps.set-universal-matrix.outputs.UNIVERSAL_MATRIX }}
      android_matrix: ${{ steps.set-android-matrix.outputs.ANDROID_MATRIX }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: set-universal-matrix
        run: |
          UNIVERSAL_MATRIX=$(jq -c '.' .github/ci/universal_matrix.json)
          echo "UNIVERSAL_MATRIX=$UNIVERSAL_MATRIX" >> "$GITHUB_OUTPUT"
      - id: set-android-matrix
        run: |
          ANDROID_MATRIX=$(jq -c '.' .github/ci/android_matrix.json)
          echo "ANDROID_MATRIX=$ANDROID_MATRIX" >> "$GITHUB_OUTPUT"
  # Testing Jobs
  IWYU:
    name: IWYU
    if: ${{ always() }}
    uses: ./.github/workflows/iwyu.yml
  Sanitizers:
    name: Sanitizers
    if: ${{ always() }}
    uses: ./.github/workflows/sanitizers.yml
  Tests:
    name: Tests
    if: ${{ always() }}
    uses: ./.github/workflows/tests.yml
  Matetrack:
    name: Matetrack
    if: ${{ always() }}
    uses: ./.github/workflows/matetrack.yml
  Games:
    name: Games
    if: ${{ always() }}
    uses: ./.github/workflows/games.yml
  CheckCompilers:
    name: Check Compilers
    if: ${{ always() }}
    uses: ./.github/workflows/check_compilers.yml
  BuildMSVC:
    name: Build MSVC
    if: ${{ always() }}
    uses: ./.github/workflows/build_msvc.yml
  BuildWASM:
    name: Build WASM
    if: ${{ always() }}
    uses: ./.github/workflows/build_wasm.yml
  # Release Jobs
  BuildUniversal:
    name: Build Universal
    needs: [Matrix, Sanitizers, Tests, Matetrack, Games, CheckCompilers]
    uses: ./.github/workflows/build_universal.yml
  BuildAndroid:
    name: Build Android
    needs: [Matrix, Sanitizers, Tests, Matetrack, Games, CheckCompilers]
    uses: ./.github/workflows/build_android.yml
    with:
      matrix: ${{ needs.Matrix.outputs.android_matrix }}
  UploadUniversal:
    name: Upload Universal
    if: github.repository == 'ehsanrashid/DON'
    needs: [Prerelease, Matrix, BuildUniversal]
    uses: ./.github/workflows/upload_binary.yml
    with:
      matrix: ${{ needs.Matrix.outputs.universal_matrix }}
      release_tag: ${{ needs.Prerelease.outputs.release_tag }}
      release_prerelease: true
    permissions:
      contents: write # For uploading release assets
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
  UploadAndroid:
    name: Upload Android
    if: github.repository == 'ehsanrashid/DON'
    needs: [Prerelease, Matrix, BuildAndroid]
    uses: ./.github/workflows/upload_binary.yml
    with:
      matrix: ${{ needs.Matrix.outputs.android_matrix }}
      release_tag: ${{ needs.Prerelease.outputs.release_tag }}
      release_prerelease: true
    permissions:
      contents: write # For uploading release assets
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
  PublishPrerelease:
    if: github.repository == 'ehsanrashid/DON' && needs.Prerelease.outputs.release_tag != ''
    needs: [Prerelease, UploadUniversal, UploadAndroid]
    runs-on: ubuntu-slim
    permissions:
      contents: write # For publishing the draft prerelease
    steps:
      - name: Publish Draft Prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.Prerelease.outputs.release_tag }}" --repo "${{ github.repository }}" --draft=false --prerelease

