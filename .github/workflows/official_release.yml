name: Official Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Official release tag in the form DON_X or DON_X.Y
        required: true
        type: string
      release_title:
        description: Official release title
        required: true
        type: string

jobs:
  Matrix:
    runs-on: ubuntu-latest
    outputs:
      universal_matrix: ${{ steps.set-universal-matrix.outputs.universal_matrix }}
      android_matrix: ${{ steps.set-android-matrix.outputs.android_matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: set-universal-matrix
        run: |
          UNIVERSAL_MATRIX=$(jq -c '.' .github/ci/universal_matrix.json)
          echo "UNIVERSAL_MATRIX=$UNIVERSAL_MATRIX" >> "$GITHUB_OUTPUT"
      - id: set-android-matrix
        run: |
          ANDROID_MATRIX=$(jq -c '.' .github/ci/android_matrix.json)
          echo "ANDROID_MATRIX=$ANDROID_MATRIX" >> "$GITHUB_OUTPUT"

  OfficialReleaseDraft:
    if: github.repository == 'ehsanrashid/DON'
    runs-on: ubuntu-latest
    needs: [Matrix]
    outputs:
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}
    permissions:
      contents: write # For creating the official release tag and draft
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Validate release request
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          if [[ "${{ github.ref_name }}" != 'main' ]]; then
            echo 'Official releases must be dispatched from main.'
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^DON_[0-9]+(\.[0-9]+)?$ ]]; then
            echo 'release_tag must match DON_X or DON_X.Y'
            exit 1
          fi

          if [[ -z "$RELEASE_TITLE" ]]; then
            echo 'release_title is required.'
            exit 1
          fi

      - name: Compute release metadata
        id: release-metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists for this tag.'
            exit 1
          fi

      - name: Ensure git tag does not already exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag already exists.'
            exit 1
          fi

      - name: Create official release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="${{ github.sha }}"

      - name: Create draft official release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TITLE" --notes ''

  BuildUniversal:
    needs: [Matrix]
    uses: ./.github/workflows/build_universal.yml

  BuildAndroid:
    needs: [Matrix]
    uses: ./.github/workflows/build_android.yml
    with:
      matrix: ${{ needs.Matrix.outputs.android_matrix }}

  UploadUniversal:
    if: github.repository == 'ehsanrashid/DON'
    needs: [OfficialReleaseDraft, Matrix, BuildUniversal]
    uses: ./.github/workflows/upload_binary.yml
    with:
      matrix: ${{ needs.Matrix.outputs.universal_matrix }}
      release_tag: ${{ needs.OfficialReleaseDraft.outputs.release_tag }}
      release_prerelease: false
    permissions:
      contents: write # For uploading release assets
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  UploadAndroid:
    if: github.repository == 'ehsanrashid/DON'
    needs: [OfficialReleaseDraft, Matrix, BuildAndroid]
    uses: ./.github/workflows/upload_binary.yml
    with:
      matrix: ${{ needs.Matrix.outputs.android_matrix }}
      release_tag: ${{ needs.OfficialReleaseDraft.outputs.release_tag }}
      release_prerelease: false
    permissions:
      contents: write # For uploading release assets
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
