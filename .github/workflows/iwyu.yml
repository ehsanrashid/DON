name: IWYU

on:
  workflow_call:

jobs:
  IWYU:
    name: Check includes
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: DON/src
        shell: bash
    steps:
      - name: Checkout DON
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: DON
          persist-credentials: false

      - name: Checkout include-what-you-use
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: include-what-you-use/include-what-you-use
          ref: 30e221f
          path: include-what-you-use
          persist-credentials: false

      - name: Download required linux packages
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main'
          sudo apt update
          sudo apt install -y llvm-19-dev libclang-19-dev clang-19 libc++-19-dev

      - name: Set up include-what-you-use
        run: |
          mkdir build && cd build
          cmake -G "Unix Makefiles" -DCMAKE_PREFIX_PATH="/usr/lib/llvm-19" ..
          sudo make install
        working-directory: include-what-you-use

      - name: Check include-what-you-use
        run: |
          set -o pipefail
          include-what-you-use --version | tee /tmp/iwyu-version.txt
          grep -F 'include-what-you-use 0.23' /tmp/iwyu-version.txt

      - name: Check build configuration
        run: |
          make -pn \
            COMP=clang \
            CXX=include-what-you-use 2>/dev/null |
          grep '^ARCH[[:space:]]*[:?+]*=' || true

      - name: Check includes
        run: |
          make analyze \
            COMP=clang \
            CXX=include-what-you-use \
            CXXFLAGS="\
              -I${{ github.workspace }}/DON/src \
              -stdlib=libc++ \
              -Xiwyu --comment_style=long \
              -Xiwyu --mapping='${{ github.workspace }}/DON/.github/ci/libcxx.imp' \
              -Xiwyu --error"
