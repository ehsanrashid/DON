name: IWYU

on:
  workflow_call:

jobs:
  IWYU:
    name: Check includes
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: DON/src
        shell: bash
    steps:
      - name: Checkout DON
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: DON
          persist-credentials: false

      - name: Checkout include-what-you-use
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: include-what-you-use/include-what-you-use
          ref: 0.24
          path: include-what-you-use
          persist-credentials: false

      - name: Download required linux packages
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository 'deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main'
          sudo apt update
          sudo apt install -y llvm-20-dev libclang-20-dev clang-20 libc++-20-dev

      - name: Set up include-what-you-use
        run: |
          mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_PREFIX_PATH="/usr/lib/llvm-20" \
            -DCMAKE_INSTALL_PREFIX="/usr/local" ..
          sudo make install
        working-directory: include-what-you-use

      - name: Check include-what-you-use
        run: |
          set -o pipefail
          command -v include-what-you-use
          include-what-you-use --version | tee /tmp/iwyu-version.txt
          grep -F 'include-what-you-use 0.24' /tmp/iwyu-version.txt

      - name: Check build configuration
        run: |
          make -pn \
            COMP=clang \
            CXX=include-what-you-use 2>/dev/null |
          grep '^ARCH[[:space:]]*[:?+]*=' || true

      - name: Check includes
        run: |
          make analyze \
            COMP=clang \
            CXX=include-what-you-use \
            CXXFLAGS="\
              -I${{ github.workspace }}/DON/src \
              -stdlib=libc++ \
              -Xiwyu --comment_style=long \
              -Xiwyu --mapping='${{ github.workspace }}/DON/.github/ci/libcxx.imp' \
              -Xiwyu --error"
