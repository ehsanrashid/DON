name: Upload Binary

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      release_tag:
        type: string
        required: false
      release_prerelease:
        type: boolean
        required: false
    secrets:
      token:
        required: true

jobs:
  UploadBinary:
    name: ${{ matrix.config.name }} (${{ matrix.binary }})
    runs-on: ubuntu-latest
    env:
      SIMPLE_NAME: ${{ matrix.config.simple_name }}
      EXT: ${{ matrix.config.ext }}
      ARCHIVE_EXT: ${{ matrix.config.archive_ext }}
      BINARY: ${{ matrix.binary }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download artifact from compilation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SIMPLE_NAME }} ${{ env.BINARY }}
          path: ${{ env.SIMPLE_NAME }} ${{ env.BINARY }}

      - name: Create Package
        run: |
          mkdir DON

      - name: Download wiki
        run: |
          git clone https://github.com/ehsanrashid/DON.wiki.git wiki
          rm -rf wiki/.git
          mv wiki DON/

      - name: Copy files
        run: |
          mv "$SIMPLE_NAME $BINARY" DON-workflow
          cd DON-workflow
          cp -r src ../DON/
          cp -r scripts ../DON/
          cp "DON-$SIMPLE_NAME-$BINARY$EXT" ../DON/
          cp CITATION.cff ../DON/
          cp Copying.txt ../DON/
          cp CONTRIBUTING.md ../DON/
          cp README.md ../DON/

      - name: Make binary executable
        run: chmod +x "./DON/DON-$SIMPLE_NAME-$BINARY$EXT"

      - name: Create tar
        if: startsWith(env.ARCHIVE_EXT, 'tar')
        run: |
          echo "Creating TAR..."
          tar -cavf "DON-$SIMPLE_NAME-$BINARY.$ARCHIVE_EXT" DON

      - name: Create zip
        if: env.ARCHIVE_EXT == 'zip'
        run: |
          echo "Creating ZIP..."
          zip -r "DON-$SIMPLE_NAME-$BINARY.zip" DON

      - name: Release
        if: startsWith(github.ref_name, 'DON_') && github.ref_type == 'tag'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: DON-${{ env.SIMPLE_NAME }}-${{ env.BINARY }}.${{ env.ARCHIVE_EXT }}
          token: ${{ secrets.token }}

      # Make sure that an old CI run on main doesn't recreate a prerelease
      - name: Get Pullable Commit Count
        id: commit-count
        run: |
          git fetch
          echo "COUNT=$(git rev-list HEAD..origin/main --count)" >> "$GITHUB_OUTPUT"

      - name: Get last commit date
        id: commit-date
        run: echo "COMMIT_DATE=$(git show -s --date=format:%Y%m%d --format=%cd HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get last commit SHA
        id: commit-sha
        run: echo "COMMIT_SHA=$(git rev-parse HEAD | cut -c 1-8)" >> "$GITHUB_OUTPUT"

      - name: Official Release?
        id: official-release
        # Check for "Official release version of DON" in the commit message
        run: |
          if git log -1 --format=%B | grep -q "Official release version of DON"; then
            echo "OFFICIAL_RELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "OFFICIAL_RELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prerelease
        if: github.ref_name == 'main' && steps.commit-count.outputs.COUNT == '0' && steps.official-release.outputs.OFFICIAL_RELEASE == 'false'
        continue-on-error: true
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: DON dev-${{ steps.commit-date.outputs.COMMIT_DATE }}-${{ steps.commit-sha.outputs.COMMIT_SHA }}
          tag_name: DON-dev-${{ steps.commit-date.outputs.COMMIT_DATE }}-${{ steps.commit-sha.outputs.COMMIT_SHA }}
          prerelease: true
          files: DON-${{ env.SIMPLE_NAME }}-${{ env.BINARY }}.${{ env.ARCHIVE_EXT }}
          token: ${{ secrets.token }}
