name: Upload Binary

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      release_tag:
        type: string
        required: false
      release_prerelease:
        type: boolean
        required: false
    secrets:
      token:
        required: true

jobs:
  UploadBinary:
    name: ${{ matrix.config.name }} (${{ matrix.binary }})
    runs-on: ubuntu-slim
    env:
      SIMPLE_NAME: ${{ matrix.config.simple_name }}
      EXT: ${{ matrix.config.ext }}
      ARCHIVE_EXT: ${{ matrix.config.archive_ext }}
      BINARY: ${{ matrix.binary }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download artifact from compilation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SIMPLE_NAME }} ${{ env.BINARY }}
          path: ${{ env.SIMPLE_NAME }} ${{ env.BINARY }}

      - name: Create Package
        run: |
          mkdir DON

      - name: Download wiki
        run: |
          git clone https://github.com/ehsanrashid/DON.wiki.git wiki
          rm -rf wiki/.git
          mv wiki DON/

      - name: Copy files
        run: |
          mv "$SIMPLE_NAME $BINARY" DON-workflow
          cd DON-workflow
          cp -r src ../DON/
          cp -r scripts ../DON/
          cp "DON-$SIMPLE_NAME-$BINARY$EXT" ../DON/
          cp CITATION.cff ../DON/
          cp Copying.txt ../DON/
          cp CONTRIBUTING.md ../DON/
          cp README.md ../DON/

      - name: Make binary executable
        run: chmod +x "./DON/DON-$SIMPLE_NAME-$BINARY$EXT"

      - name: Create tar
        if: startsWith(env.ARCHIVE_EXT, 'tar')
        run: |
          echo "Creating TAR..."
          tar -cavf "DON-$SIMPLE_NAME-$BINARY.$ARCHIVE_EXT" DON

      - name: Create zip
        if: env.ARCHIVE_EXT == 'zip'
        run: |
          echo "Creating ZIP..."
          zip -r "DON-$SIMPLE_NAME-$BINARY.zip" DON

      - name: Upload Draft Release Asset
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          tag_name: ${{ inputs.release_tag }}
          draft: true
          prerelease: ${{ inputs.release_prerelease }}
          files: DON-${{ env.SIMPLE_NAME }}-${{ env.BINARY }}.${{ env.ARCHIVE_EXT }}
          token: ${{ secrets.token }}
