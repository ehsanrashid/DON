name: Build Universal

on:
  workflow_call:

jobs:
  BuildUniversalLinux:
    name: Linux
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install GCC 15
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 15

      - name: Download SDE package
        uses: petarpetrovt/setup-sde@31aa4a8e85e109bef00f1d838613fcc6ec421271 # v5.0
        with:
          environmentVariableName: SDE_DIR
          sdeVersion: 9.58.0

      - name: Build Linux x86-64 universal binary with GCC and SDE
        run: make -j4 -C src ARCH=x86-64-universal profile-build RUN_PREFIX="$SDE_DIR/sde -future --"

      - name: Strip Linux x86-64 universal binary
        run: strip src/DON

      - name: Rename Linux x86-64 universal binary
        run: mv src/DON DON-linux-x86-64-universal

      - name: Extract the bench number from the commit history
        run: |
          benchref=""
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s "$hash" |
              tac |
              grep -m 1 -o -x '[[:space:]]*[Bb]ench[ :]\{1,\}[1-9][0-9]\{5,7\}[[:space:]]*' |
              sed 's/[^0-9]//g') || true

            if [ -n "$benchref" ]; then
              break
            fi
          done

          if [ -n "$benchref" ]; then
            echo "benchref=$benchref" >> "$GITHUB_ENV"
            echo "From commit: $hash"
            echo "Reference bench: $benchref"
          else
            echo "No bench found"
          fi

      - name: Verify architecture selection under SDE
        run: ./scripts/check_universal_x86_64.sh ./DON-linux-x86-64-universal "$SDE_DIR/sde" "$benchref"

      - name: Clean untracked and ignored src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux x86-64-universal
          path: |
             .
             !.git
             !.output

  BuildUniversalWindows:
    name: Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup msys and install required packages
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc make git zip

      - name: Download SDE package
        uses: petarpetrovt/setup-sde@31aa4a8e85e109bef00f1d838613fcc6ec421271 # v5.0
        with:
          environmentVariableName: SDE_DIR
          sdeVersion: 9.58.0

      - name: Build Windows x86-64 universal binary with MinGW-w64 GCC and SDE
        run: |
          SDE_PATH=$(cygpath "$SDE_DIR")
          make -j4 -C src ARCH=x86-64-universal profile-build RUN_PREFIX="$SDE_PATH/sde.exe -future --"

      - name: Strip Windows x86-64 universal binary
        run: strip src/DON.exe

      - name: Rename Windows x86-64 universal binary
        run: mv src/DON.exe DON-windows-x86-64-universal.exe

      - name: Extract the bench number from the commit history
        run: |
          benchref=""
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s "$hash" |
              tac |
              grep -m 1 -o -x '[[:space:]]*[Bb]ench[ :]\{1,\}[1-9][0-9]\{5,7\}[[:space:]]*' |
              sed 's/[^0-9]//g') || true

            if [ -n "$benchref" ]; then
              break
            fi
          done

          if [ -n "$benchref" ]; then
            echo "benchref=$benchref" >> "$GITHUB_ENV"
            echo "From commit: $hash"
            echo "Reference bench: $benchref"
          else
            echo "No bench found"
          fi
  
      - name: Verify architecture selection under SDE
        run: ./scripts/check_universal_x86_64.sh ./DON-windows-x86-64-universal.exe "$SDE_DIR/sde" "$benchref"

      - name: Clean untracked and ignored src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows x86-64-universal
          path: |
             .
             !.git
             !.output

  BuildUniversalLinuxARM64:
    name: Linux ARM64
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install GCC 15
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 15

      - name: Install qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Build Linux ARM64 universal binary with GCC
        run: make -j4 -C src ARCH=arm64-universal profile-build

      - name: Strip Linux ARM64 universal binary
        run: strip src/DON

      - name: Rename Linux ARM64 universal binary
        run: mv src/DON DON-linux-arm64-universal

      - name: Extract the bench number from the commit history
        run: |
          benchref=""
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s "$hash" |
              tac |
              grep -m 1 -o -x '[[:space:]]*[Bb]ench[ :]\{1,\}[1-9][0-9]\{5,7\}[[:space:]]*' |
              sed 's/[^0-9]//g') || true

            if [ -n "$benchref" ]; then
              break
            fi
          done

          if [ -n "$benchref" ]; then
            echo "benchref=$benchref" >> "$GITHUB_ENV"
            echo "From commit: $hash"
            echo "Reference bench: $benchref"
          else
            echo "No bench found"
          fi

      - name: Verify architecture selection under QEMU
        run: ./scripts/check_universal_arm64.sh ./DON-linux-arm64-universal "$benchref"

      - name: Clean untracked and ignored src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux arm64-universal
          path: |
             .
             !.git
             !.output

  BuildUniversalWindowsARM64:
    name: Windows ARM64
    runs-on: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup msys and install required packages
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: clangarm64
          install: mingw-w64-clang-aarch64-clang make git zip

      - name: Build Windows ARM64 universal binary with Clang
        run: make -j4 -C src ARCH=arm64-universal profile-build COMP=clang COMPCXX=clang++

      - name: Strip Windows ARM64 universal binary
        run: strip src/DON.exe

      - name: Extract the bench number from the commit history
        run: |
          benchref=""
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s "$hash" |
              tac |
              grep -m 1 -o -x '[[:space:]]*[Bb]ench[ :]\{1,\}[1-9][0-9]\{5,7\}[[:space:]]*' |
              sed 's/[^0-9]//g') || true

            if [ -n "$benchref" ]; then
              break
            fi
          done

          if [ -n "$benchref" ]; then
            echo "benchref=$benchref" >> "$GITHUB_ENV"
            echo "From commit: $hash"
            echo "Reference bench: $benchref"
          else
            echo "No bench found"
          fi

      - name: Verify compiler features and bench
        working-directory: src
        run: |
          ./DON compiler 2>&1 | grep -q DOTPROD || { echo "compiler output missing DOTPROD" >&2; exit 1; }
          ../tests/signature.sh "$benchref"

      - name: Rename Windows ARM64 universal binary
        run: mv src/DON.exe DON-windows-arm64-universal.exe

      - name: Clean untracked and ignored src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows arm64-universal
          path: |
             .
             !.git
             !.output

  BuildUniversalLinuxRISCV64:
    name: Linux RISC-V64
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      QEMU_DEB: https://launchpad.net/ubuntu/+archive/primary/+files/qemu-user_9.2.1+ds-1ubuntu5_amd64.deb
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install clang and the riscv cross runtime
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 llvm-20 g++-riscv64-linux-gnu
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Cache qemu-user deb
        id: cache-qemu
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
         path: /tmp/qemu.deb
         key: qemu-user-9.2.1+ds-1ubuntu5_amd64

      - name: Install qemu
        run: |
          if [ "${{ steps.cache-qemu.outputs.cache-hit }}" != "true" ]; then
            curl -fsSL -o /tmp/qemu.deb "$QEMU_DEB"
          fi
          dpkg -x /tmp/qemu.deb /tmp/qemu
          /tmp/qemu/usr/bin/qemu-riscv64 --version
          echo "/tmp/qemu/usr/bin" >> "$GITHUB_PATH"

      - name: Build Linux RISC-V64 universal binary with Clang
        run: |
          make -j4 -C src ARCH=riscv64-universal build \
            COMP=clang COMPCXX=clang++ \
            EXTRA_CXXFLAGS="--target=riscv64-linux-gnu" \
            EXTRA_LDFLAGS="--target=riscv64-linux-gnu -fuse-ld=lld" \
            OBJCOPY=llvm-objcopy

      - name: Strip Linux RISC-V64 universal binary
        run: llvm-strip src/DON

      - name: Rename Linux RISC-V64 universal binary
        run: mv src/DON DON-linux-riscv64-universal

      - name: Extract the bench number from the commit history
        run: |
          benchref=""
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s "$hash" |
              tac |
              grep -m 1 -o -x '[[:space:]]*[Bb]ench[ :]\{1,\}[1-9][0-9]\{5,7\}[[:space:]]*' |
              sed 's/[^0-9]//g') || true

            if [ -n "$benchref" ]; then
              break
            fi
          done

          if [ -n "$benchref" ]; then
            echo "benchref=$benchref" >> "$GITHUB_ENV"
            echo "From commit: $hash"
            echo "Reference bench: $benchref"
          else
            echo "No bench found"
          fi

      - name: Verify architecture selection under QEMU
        run: |
          QEMU=qemu-riscv64 QEMU_LD_PREFIX=/usr/riscv64-linux-gnu \
          ./scripts/check_universal_riscv64.sh ./DON-linux-riscv64-universal "$benchref"

      - name: Clean untracked and ignored src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux riscv64-universal
          path: |
             .
             !.git
             !.output

  BuildUniversalMacOS:
    name: macOS
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      # macOS 15 is Apple Silicon; Rosetta 2 is needed to exercise the x86-64 slice
      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Build macOS universal binary with Clang
        run: make -j4 -C src macos-lipo COMP=clang

      - name: Rename macOS universal binary
        run: mv src/DON DON-macos-universal

      - name: Verify macOS universal binary runs natively and under Rosetta
        run: ./scripts/check_universal_macos.sh ./DON-macos-universal

      - name: Clean untracked and ignored src files
        run: git clean -fxd -- src

      - name: Upload artifact for (pre)-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos universal
          path: |
             .
             !.git
             !.output
